[project]
name = "hackathon-index"
version = "0.1.0"
description = "A database of past hackathons, their prizes and winning projects"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5", "questionary>=2"]

[project.scripts]
hackathon-index = "hackathon_index.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["hackathon_index", "hackathon_index.sources", "hackathon_index.sources.devpost"]
